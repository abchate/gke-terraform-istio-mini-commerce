# VirtualService : règles de routage HTTP vers chaque microservice
# /api/products  → product-service
# /api/orders    → order-service
# /              → web (frontend)
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: mini-commerce-vs
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - mini-commerce-gateway
  http:
    # Route /api/products vers product-service
    - match:
        - uri:
            prefix: /api/products
      rewrite:
        uri: /products
      route:
        - destination:
            host: product-service
            port:
              number: 3005

    # Route /api/orders vers order-service
    - match:
        - uri:
            prefix: /api/orders
      rewrite:
        uri: /orders
      route:
        - destination:
            host: order-service
            port:
              number: 3006

    # Route / vers le frontend Vue 3
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: web
            port:
              number: 80
