apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: abchate/gateway:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3005"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3006"
            - name: FRONTEND_SERVICE_URL
              value: "http://web:80"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8085