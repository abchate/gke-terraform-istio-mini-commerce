# Script SQL exécuté au premier démarrage de Postgres (création de la table orders)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-create-table.sql: |
    -- Table des commandes pour order-service
    CREATE TABLE IF NOT EXISTS orders (
      id         VARCHAR(36) PRIMARY KEY,
      product_id VARCHAR(50) NOT NULL,
      quantity   INTEGER NOT NULL CHECK (quantity > 0),
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
---
# Postgres en StatefulSet + PVC = données persistantes (survit aux redémarrages du pod).
# Les identifiants viennent du Secret postgres-credentials (à créer avant : kubectl apply -f k8s/postgres-secret.yaml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ordersdb"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          env:
            - name: ORDER_DB_HOST
              value: "postgres"
            - name: ORDER_DB_PORT
              value: "5432"
            - name: ORDER_DB_NAME
              value: "ordersdb"
            - name: ORDER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3005"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 3006
      targetPort: 3006