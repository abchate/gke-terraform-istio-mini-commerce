# Secret pour les identifiants Postgres (mot de passe en clair ici pour le dev/démo).
# En production : kubectl create secret generic postgres-credentials --from-literal=username=... --from-literal=password=...
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  username: "ordersuser"
  password: "orderspass"
